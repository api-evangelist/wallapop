name: Wallapop
description: >-
  Wallapop is a Barcelona-based consumer marketplace for buying and selling
  second-hand items across Spain, Italy, and Portugal, backed by Accel,
  Insight Partners, and Northzone. Its Wallapop Connect API lets professional
  sellers and third-party integrators programmatically publish and manage
  listings (Items Connect API), accept shipping requests and track
  transactions through delivery (Transactions Connect API), and subscribe to
  signed event notifications (Webhooks Connect API), all secured with OAuth
  2.0 Authorization Code + PKCE via its Keycloak-based identity service.
